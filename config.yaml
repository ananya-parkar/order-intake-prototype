# Agent A settings. Change values here, not in the code.
# Secrets (ANTHROPIC_API_KEY, GROQ_API_KEY, DATABASE_URL, DOCINTEL_KEY ...) stay in .env and never go in this file.

llm:
  provider: anthropic                # anthropic (Claude) or groq
  model: claude-sonnet-5-5
  temperature: 0                     # Groq only - newer Claude models don't accept it
  reasoning_effort: low              # Groq only: fewer hidden tokens -> fewer rate-limit errors
  max_completion_tokens: 16000       # room for big POs
  timeout_seconds: 300               # big POs can take more than 2 minutes
  max_attempts: 6                    # retries when the model API is busy (429 / 5xx), times out or drops
  price_input_per_mtok: 2.00         # USD per million input tokens  (claude-sonnet-5-5 list price - check before quoting)
  price_output_per_mtok: 10.00       # USD per million output tokens

paths:                               # relative to the project folder
  samples: data/samples              # synthetic emails (safe to send to an external LLM)
  output: output
  accounts: data/mock_accounts.json

a1:
  first_case_number: 100001          # -> CaseNumber "00100001"
  signature_max_bytes: 30000         # inline images smaller than this are logos
  max_nesting: 2                     # forwarded email inside forwarded email

a2:
  body_limit_chars: 6000             # email text sent to the model
  low_confidence: 0.6                # below this -> flag low_confidence
  use_ariba_rule: true               # fixed rule for SAP Ariba order emails (no model call)

a3:
  supplier_names: "Ingredion, Northfield Ingredients"
  max_doc_chars: 15000               # document text sent to the model
  ocr_low: 0.80                      # OCR confidence below this -> check ocr_low
  no_quote_cap: 0.30                 # max confidence when the quote is not found in the document
  pdf_dpi: 300                       # scan rendering for OCR
  min_page_chars: 50                 # fewer characters on a PDF page -> treat it as a scan
  min_ocr_width: 2000                # enlarge smaller images before OCR

a4:
  timezone: America/Chicago          # Created_On uses US Central time, like the RPA
  order_reason: "200"                # fixed SAP values from the client
  order_type: TA
  sales_org: "1000"
  distribution_channel: "01"
  division: "00"
  # review gate (payloads/<PO>.meta.json): every case is reviewed; these decide ready_for_sap vs needs_review
  review_min_confidence: 0.85        # PO confidence below this -> needs_review
  check_past_request_date: true      # flag a Request_Date that is already past (set false for old test emails)
  zero_qty_lines: skip               # skip = leave quantity-0 lines out | send = keep them (flagged)
  sap_uom_codes: [LB, KG, BAG, SAC]  # unit codes SAP accepts - add more once the RPA team confirms
  uom_map:                           # customer spelling -> SAP code (exact match, upper case)
    LBS: LB
    LBR: LB
    "#": LB
    BAGS: BAG
    BG: BAG
    "50#": BAG
    SACK: SAC
    SACKS: SAC
    SK: SAC
  uom_prefix:                        # starts with -> SAP code (BAG50LB -> BAG, SACK2000 -> SAC)
    BAG: BAG
    SACK: SAC

ocr:                                 # engine for scanned PDF pages and photos (text PDF, Excel, Word are read directly)
  provider: azure_di                 # azure_di (Document Intelligence) or tesseract
  timeout_seconds: 60
  poll_seconds: 1.5                  # how often to ask DI whether the result is ready
  max_attempts: 6                    # retries when DI is busy (free tier: 20 calls per minute)
  price_per_1000_pages: 0            # 0 on the Free F0 tier; set the S0 "Read" price from Azure's pricing page

cache:                               # reuse model answers / OCR for the same input (cache.py)
  enabled: true                      # false = always call the model and OCR again
  dir: .cache                        # git-ignored - holds real email and PO text, never commit it